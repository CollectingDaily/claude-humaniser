<svg xmlns="http://www.w3.org/2000/svg" width="980" height="318" viewBox="0 0 980 318"><rect x="0.5" y="0.5" width="979" height="317" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">How the humaniser works</tspan></text><rect x="5.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="33.0" cy="96" r="15" fill="#f2c14e"/><text x="33.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="33.0" dy="0.0">1</tspan></text><text x="19.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Your text</tspan></text><text x="19.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Anything written</tspan><tspan x="19.0" dy="17.8">with AI, or any</tspan><tspan x="19.0" dy="17.8">draft you want</tspan><tspan x="19.0" dy="17.8">checked.</tspan></text><line x1="178.0" y1="166.0" x2="193.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M190.0,158.0 L202.0,166.0 L190.0,174.0 Z" fill="#8fd1d5"/><rect x="205.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="233.0" cy="96" r="15" fill="#323748"/><text x="233.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="233.0" dy="0.0">2</tspan></text><text x="219.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Spot the signs</tspan></text><text x="219.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Reads every line for</tspan><tspan x="219.0" dy="17.8">the 33 tell-tale</tspan><tspan x="219.0" dy="17.8">signs of machine</tspan><tspan x="219.0" dy="17.8">writing.</tspan></text><line x1="378.0" y1="166.0" x2="393.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M390.0,158.0 L402.0,166.0 L390.0,174.0 Z" fill="#8fd1d5"/><rect x="405.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="433.0" cy="96" r="15" fill="#323748"/><text x="433.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="433.0" dy="0.0">3</tspan></text><text x="419.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Rewrite</tspan></text><text x="419.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Rewrites those lines</tspan><tspan x="419.0" dy="17.8">plainly. Every fact</tspan><tspan x="419.0" dy="17.8">stays; nothing is</tspan><tspan x="419.0" dy="17.8">invented.</tspan></text><line x1="578.0" y1="166.0" x2="593.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M590.0,158.0 L602.0,166.0 L590.0,174.0 Z" fill="#8fd1d5"/><rect x="605.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="633.0" cy="96" r="15" fill="#323748"/><text x="633.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="633.0" dy="0.0">4</tspan></text><text x="619.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">Check again</tspan></text><text x="619.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">Asks: what still</tspan><tspan x="619.0" dy="17.8">sounds like AI? Did</tspan><tspan x="619.0" dy="17.8">I add anything? Is</tspan><tspan x="619.0" dy="17.8">it all British</tspan><tspan x="619.0" dy="17.8">English?</tspan></text><line x1="778.0" y1="166.0" x2="793.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M790.0,158.0 L802.0,166.0 L790.0,174.0 Z" fill="#8fd1d5"/><rect x="805.0" y="66" width="170" height="200" rx="12" fill="#323748"/><circle cx="833.0" cy="96" r="15" fill="#8fd1d5"/><text x="833.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="833.0" dy="0.0">5</tspan></text><text x="819.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">Human, British</tspan></text><text x="819.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">Your text, sounding</tspan><tspan x="819.0" dy="17.8">like a person wrote</tspan><tspan x="819.0" dy="17.8">it, in British</tspan><tspan x="819.0" dy="17.8">English.</tspan></text><text x="490.0" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6f7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Quotes, names, links and figures are never changed.</tspan></text></svg>